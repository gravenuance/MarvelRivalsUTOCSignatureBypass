name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v3
      # Recorded so a release can be rebuilt byte for byte with the same compiler.
      - name: Toolset version
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          "MSVC $(Get-Content "$vs/VC/Auxiliary/Build/Microsoft.VCToolsVersion.v143.default.txt")"
      - name: Build
        run: msbuild MarvelRivalsUTOCSignatureBypass.sln /p:Configuration=Release /p:Platform=x64 /m /nologo
      - name: Test
        run: build\Release\Tests.exe
      - name: Extract changelog section
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version" }
          $end = ($lines[$start..($lines.Count - 1)] | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $section = if ($end) { $lines[$start..($start + $end - 2)] } else { $lines[$start..($lines.Count - 1)] }
          $section -join "`n" | Set-Content release-notes.md
      - name: Checksums
        shell: pwsh
        run: |
          $asi = Get-Item build/Release/MarvelRivalsUTOCSignatureBypass.asi
          # LF, not CRLF, so sha256sum -c accepts the file.
          $line = "$((Get-FileHash $asi -Algorithm SHA256).Hash.ToLowerInvariant())  $($asi.Name)`n"
          [IO.File]::WriteAllText("$PWD/build/Release/SHA256SUMS.txt", $line)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/Release/MarvelRivalsUTOCSignatureBypass.asi
      - uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-notes.md
          files: |
            build/Release/MarvelRivalsUTOCSignatureBypass.asi
            build/Release/SHA256SUMS.txt
