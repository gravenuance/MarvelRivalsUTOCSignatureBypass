name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v3
      # Recorded so a release can be rebuilt byte for byte with the same compiler.
      - name: Toolset version
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          "MSVC $(Get-Content "$vs/VC/Auxiliary/Build/Microsoft.VCToolsVersion.v143.default.txt")"
      # Release is the shipping configuration: /W4 /WX applies, so any warning fails the run.
      - name: Build
        run: msbuild MarvelRivalsUTOCSignatureBypass.sln /p:Configuration=Release /p:Platform=x64 /m /nologo
      - name: Test
        run: build\Release\Tests.exe
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: MarvelRivalsUTOCSignatureBypass
          path: build/Release/MarvelRivalsUTOCSignatureBypass.asi
